# -*- coding: utf-8 -*-
# Naginata-shiki additions, appended to macSKK's stock kana-rule.conf.
#
# Columns: input,hiragana[,katakana[,halfwidth-kana[,pending-romaji]]]
#
# ? and ! should come out full-width in kana mode. The stock table has rows for
# - , . [ ] but none for ? or !, so both arrive as raw half-width characters.
# The kana rule only applies in the kana modes, so direct input still types the
# half-width forms.
#
# Reachability under the Naginata layer:
#   ?  S-/          -- the unshifted plane deliberately has no shifted twin for
#                      slash, so S-/ passes straight through. ▽れ is still
#                      available as Shift+space+/ because れ sits on both planes.
#   !  S-1          -- the number row is out of scope, so it passes through.
?,？,？,?
!,！,！,!
